# Baseline for `checkov -d infra/aws/terraform` (run in terraform-check.yml). Every skip has a reason and a class:
#   ACCEPTED = deliberate or a tool false positive; OPEN = a real gap tracked in docs/aws-verification-evidence.md (not "passed").
# A NEW finding fails CI. Remove an OPEN line when its gap is closed.
framework:
  - terraform
quiet: true
compact: true
skip-check:
  # ACCEPTED
  - CKV2_AWS_5    # security groups are attached through for_each resources (ECS services, ALBs, RDS, Redis); checkov cannot follow for_each
  - CKV2_AWS_19   # the EIPs are attached to NAT gateways
  - CKV2_AWS_38   # DNSSEC does not apply to a private (VPC-only) hosted zone
  - CKV2_AWS_39   # query logging is not supported for private hosted zones in this configuration; resolver query logs are a separate decision
  - CKV2_AWS_50   # Redis Multi-AZ/failover is production-only by design (staging is one node to control cost)
  - CKV2_AWS_64   # the KMS key uses the default key policy (account root); least privilege is enforced by IAM and key grants
  - CKV_AWS_150   # ALB deletion protection is production-only by design so staging can be torn down
  - CKV_AWS_293   # RDS deletion protection is production-only by design so staging can be torn down
  - CKV_AWS_161   # IAM database authentication is intentionally off: the strict runtime login model (ADR 0040/0008) uses Secrets Manager credentials
  - CKV_AWS_356   # the remaining "*" resources are ecs:Describe*/ListTasks and ecr:GetAuthorizationToken, which do not support resource-level permissions
  # OPEN (see docs/aws-verification-evidence.md)
  - CKV2_AWS_11   # OPEN: VPC flow logs not enabled (cost decision; recommended before production)
  - CKV2_AWS_31   # OPEN: WAF logging not enabled
  - CKV2_AWS_57   # OPEN: Secrets Manager rotation for runtime database/Redis URLs (set out of band today)
  - CKV_AWS_31    # OPEN: Redis has TLS and at-rest encryption but no AUTH token / RBAC user group
  - CKV_AWS_91    # OPEN: ALB access logging needs a log bucket (not in this stack)
  - CKV_AWS_118   # OPEN: RDS enhanced monitoring off (Performance Insights is on)
  - CKV_AWS_129   # OPEN: RDS log exports to CloudWatch not enabled
  - CKV_AWS_338   # OPEN: log retention is 30/90 days; the 1-year standard needs an owner/compliance decision and a cost estimate
