name: Deploy gate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  deploy-gate:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: echo "Deployment is manual and provider-managed. For AWS use the "AWS images" then "AWS deploy" workflows (docs/runbooks/aws-ecs-deployment.md); complete docs/runbooks/deploy.md first."
