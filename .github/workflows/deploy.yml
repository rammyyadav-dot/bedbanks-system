name: Deploy gate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  deploy-gate:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: echo "Deployment is manual and provider-managed. For AWS use the "AWS images" then "AWS deploy" workflows (docs/runbooks/aws-ecs-deployment.md); complete docs/runbooks/deploy.md first."
