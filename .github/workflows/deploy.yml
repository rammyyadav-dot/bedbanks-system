name: Deploy gate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]

jobs:
  deploy-gate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deployment is manual and provider-managed. For AWS use the "AWS images" then "AWS deploy" workflows (docs/runbooks/aws-ecs-deployment.md); complete docs/runbooks/deploy.md first."
