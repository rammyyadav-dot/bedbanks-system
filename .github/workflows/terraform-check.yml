name: Terraform check

on:
  pull_request:
    paths: ['infra/aws/terraform/**', '.github/workflows/terraform-check.yml']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform -chdir=infra/aws/terraform fmt -check -recursive
      - run: terraform -chdir=infra/aws/terraform init -backend=false
      - run: terraform -chdir=infra/aws/terraform validate
