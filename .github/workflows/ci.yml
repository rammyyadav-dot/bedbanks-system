name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

# A newer push to the same PR supersedes the older run; branch pushes keep running to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  schema-integrity:
    name: Schema integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:schema
      - run: pnpm check:architecture
      - run: node --test tools/clone-certification-guard.test.mjs
      - run: node --test tools/migration-ledger-check.test.mjs
      - name: Committed migration chain (IDs, collisions, SQL present)
        run: node tools/migration-ledger-check.mjs chain
      - run: node --import tsx --test tools/runtime-db-role-check.test.ts
      - run: node --import tsx --test tools/tenant-filter-check.test.ts

  prisma-migration-certification:
    name: Prisma migration certification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fbeds_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fbeds_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fbeds_ci?schema=public
      MAPPING_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fbeds_ci?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify disposable database target and record runner
        run: |
          node - <<'NODE'
          const os = require('node:os');
          const u = new URL(process.env.DATABASE_URL);
          if (!['localhost', '127.0.0.1'].includes(u.hostname) || u.pathname !== '/fbeds_ci' || process.env.NODE_ENV !== 'test') throw new Error('DISPOSABLE_TARGET_REQUIRED');
          console.log(JSON.stringify({ track: 'engineering-only', timestamp: new Date().toISOString(), node: process.version, platform: os.platform(), arch: os.arch(), cpus: os.cpus().length, memoryGiB: Math.round(os.totalmem()/1024**3), concurrency: 10 }));
          NODE
      - run: pnpm --filter @bedbanks/api prisma:validate
      - run: pnpm --filter @bedbanks/api prisma:generate
      - name: Replace disposable service bootstrap credential with a fresh owner credential
        run: pnpm --filter @bedbanks/api exec node --no-experimental-strip-types -r @swc-node/register scripts/certify-disposable-runtime-role.cjs --rotate-owner
      - run: pnpm --filter @bedbanks/api prisma:migrate:deploy
      - run: pnpm --filter @bedbanks/api prisma:migrate:status
      - run: pnpm --filter @bedbanks/api prisma:migrate:drift
      - run: pnpm --filter @bedbanks/api type-check
      - name: Certify disposable target, strict login and forced RLS
        run: pnpm --filter @bedbanks/api exec node --no-experimental-strip-types -r @swc-node/register scripts/certify-disposable-runtime-role.cjs
      - name: Hotel database acceptance (sequential, strict-role HTTP plus owner fixture suites)
        run: >-
          pnpm --filter @bedbanks/api test:e2e --
          api-runtime-role.e2e-spec.ts hotel-commercial.e2e-spec.ts inventory-runtime-http.e2e-spec.ts
          pool-capacity-editor.e2e-spec.ts hotel-setup.e2e-spec.ts
          strict-runtime-role-hotel-setup.e2e-spec.ts strict-runtime-role-commercial.e2e-spec.ts
          strict-runtime-role-workflows.e2e-spec.ts strict-runtime-role-replay.e2e-spec.ts
          inventory-search-recheck.e2e-spec.ts inventory-pool-lifecycle.e2e-spec.ts
          strict-role-rollout.e2e-spec.ts
      - name: Sandbox staging strict-role acceptance (disposable PostgreSQL)
        run: pnpm --filter @bedbanks/api test:e2e -- sandbox-content-staging.e2e-spec.ts
      - name: Tenant and database security certification (every restricted role, catalog, routes, cross-tenant, sessions, audit)
        run: pnpm --filter @bedbanks/api test:security
      - run: pnpm --filter @bedbanks/api test:e2e
      - run: pnpm --filter @bedbanks/api prisma:migrate:drift
      - name: Re-certify strict login, protected columns and forced RLS after all suites
        run: pnpm --filter @bedbanks/api exec node --no-experimental-strip-types -r @swc-node/register scripts/certify-disposable-runtime-role.cjs

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fbeds_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fbeds_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fbeds_ci?schema=public
      MAPPING_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fbeds_ci?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Turborepo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-verify-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-verify-
      - run: pnpm --filter @bedbanks/api prisma:generate
      - name: Replace disposable service bootstrap credential with a fresh owner credential
        run: pnpm --filter @bedbanks/api exec node --no-experimental-strip-types -r @swc-node/register scripts/certify-disposable-runtime-role.cjs --rotate-owner
      - run: pnpm --filter @bedbanks/api prisma:migrate:deploy
      - name: Certify tenant control with distinct restricted API and authoring roles
        run: pnpm --filter @bedbanks/api ops:certify-tenant-control
      - run: pnpm exec tsx --tsconfig apps/api/tsconfig.json apps/api/test/preview-di.smoke.ts
      - run: pnpm turbo run type-check lint --cache-dir=.turbo --env-mode=loose
      # Tests need the live Postgres/Redis services, so they are never served from the Turborepo cache.
      - run: pnpm -r --if-present test
      - run: pnpm turbo run build --cache-dir=.turbo --env-mode=loose

  e2e-release-suite:
    name: End-to-end release suite (Admin, Agent, Supplier)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Turborepo cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-e2e-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-e2e-
      - run: pnpm --filter @bedbanks/api prisma:generate
      - name: Build the three portals (production mode, as deployed)
        run: >-
          pnpm turbo run build --cache-dir=.turbo --env-mode=loose
          --filter=./apps/agent --filter=./apps/admin --filter=./apps/supplier
      - run: pnpm --filter @bedbanks/e2e type-check
      - run: pnpm --filter @bedbanks/e2e exec playwright install --with-deps chromium
      - name: Run the suite against a disposable database, the API and the three portals
        run: pnpm --filter @bedbanks/e2e e2e
      - name: Upload report and service logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-release-suite-report
          path: |
            e2e/.artifacts/report
            e2e/.artifacts/results
            e2e/.artifacts/*.log
          if-no-files-found: ignore
          retention-days: 7

  website-production-checks:
    name: Website production checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://www.fbeds.com
      EXPECTED_SITE_URL: https://www.fbeds.com
      CHECK_BASE_URL: http://localhost:4710
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bedbanks/website type-check
      - run: pnpm --filter @bedbanks/website lint
      - run: pnpm --filter @bedbanks/website test
      - run: pnpm --filter @bedbanks/website build
      - run: pnpm --filter @bedbanks/website exec playwright install --with-deps chromium
      - name: Start the production build
        run: |
          pnpm --filter @bedbanks/website exec next start -p 4710 > website-server.log 2>&1 &
          for _ in $(seq 1 40); do curl -sf -o /dev/null "$CHECK_BASE_URL/" && exit 0; sleep 1; done
          cat website-server.log; exit 1
      - name: Links, anchors, redirects, sitemap and canonicals (built site)
        run: pnpm --filter @bedbanks/website check:site
      - name: Browser checks (CSP, hydration, lead form, accessibility)
        run: pnpm --filter @bedbanks/website test:e2e
      - name: "External links (resilient - transient failures warn, 404 and 410 fail)"
        run: pnpm --filter @bedbanks/website check:site -- --external
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: website-playwright-report
          path: |
            apps/website/playwright-report
            apps/website/test-results
          if-no-files-found: ignore
