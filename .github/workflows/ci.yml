name: CI

on:
  pull_request:
  push:

jobs:
  schema-integrity:
    name: Schema integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:schema
      - run: node --test tools/clone-certification-guard.test.mjs

  prisma-migration-certification:
    name: Prisma migration certification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fbeds_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fbeds_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fbeds_ci?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify disposable database target and record runner
        run: |
          node - <<'NODE'
          const os = require('node:os');
          const u = new URL(process.env.DATABASE_URL);
          if (!['localhost', '127.0.0.1'].includes(u.hostname) || u.pathname !== '/fbeds_ci' || process.env.NODE_ENV !== 'test') throw new Error('DISPOSABLE_TARGET_REQUIRED');
          console.log(JSON.stringify({ track: 'engineering-only', timestamp: new Date().toISOString(), node: process.version, platform: os.platform(), arch: os.arch(), cpus: os.cpus().length, memoryGiB: Math.round(os.totalmem()/1024**3), concurrency: 10 }));
          NODE
      - run: pnpm --filter @bedbanks/api prisma:validate
      - run: pnpm --filter @bedbanks/api prisma:generate
      - run: pnpm --filter @bedbanks/api prisma:migrate:deploy
      - run: pnpm --filter @bedbanks/api prisma:migrate:status
      - run: pnpm --filter @bedbanks/api prisma:migrate:drift
      - run: pnpm --filter @bedbanks/api type-check
      - run: pnpm --filter @bedbanks/api test:e2e
      - run: pnpm --filter @bedbanks/api prisma:migrate:drift

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fbeds_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fbeds_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fbeds_ci?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bedbanks/api prisma:generate
      - run: pnpm --filter @bedbanks/api prisma:migrate:deploy
      - run: pnpm exec tsx --tsconfig apps/api/tsconfig.json apps/api/test/preview-di.smoke.ts
      - run: pnpm -r --if-present type-check
      - run: pnpm -r --if-present lint
      - run: pnpm -r --if-present test
      - run: pnpm -r --if-present build
