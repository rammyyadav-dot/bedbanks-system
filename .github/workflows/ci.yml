name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: DATABASE_URL=postgresql://postgres:postgres@localhost:5432/fbeds_ci pnpm --filter @bedbanks/api prisma:generate
      - run: pnpm check:architecture
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
