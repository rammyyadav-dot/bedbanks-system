name: AWS rollback

# Manual, environment-gated (same required reviewers as AWS deploy). Points one ECS service back at a task definition revision that already exists:
# by default the revision before the one currently running. Application code only: it never touches the database (migrations are forward-only; follow
# docs/runbooks/rollback.md for schema questions). The service stays on the commit-pinned image digest recorded in that revision.
on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [staging, production]
      service:
        description: Service to roll back
        required: true
        type: choice
        options: [api, admin, agent, supplier, website]
      revision:
        description: Task definition revision number to restore (empty = the revision immediately before the running one)
        required: false
        type: string
        default: ''
      reason:
        description: Why (recorded in the run summary and the audit trail)
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Roll back and wait for stability
        env:
          CLUSTER: fbeds-${{ inputs.environment }}
          SERVICE: ${{ inputs.service }}
          REVISION: ${{ inputs.revision }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
        run: tools/ops/ecs-rollback.sh
