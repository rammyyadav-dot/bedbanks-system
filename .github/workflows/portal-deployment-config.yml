name: Portal deployment configuration

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  portal-deployment-config:
    name: Portal deployment configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          # No dependencies are installed here; setup-node v5 would otherwise auto-cache pnpm before pnpm exists.
          package-manager-cache: false
      - run: node --test tools/deployment/config.test.mjs

  build-environment-hashing:
    name: Build environment hashing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/deployment/check-build-env.mjs
