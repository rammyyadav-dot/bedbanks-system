name: Portal deployment configuration

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  portal-deployment-config:
    name: Portal deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tools/deployment/config.test.mjs

  build-environment-hashing:
    name: Build environment hashing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/deployment/check-build-env.mjs
