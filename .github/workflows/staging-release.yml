name: Staging release

# Owner re-entry after a migration hold, and a stable workflow name for existing runbooks.
# Automatic merge-to-main delivery lives in deploy.yml (workflow_run on CI). This file must not also listen
# for that event: two pipelines would roll staging twice.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA on main (empty = the tip of main)
        required: false
        type: string
        default: ''
      migrations_applied:
        description: I ran scripts/ecs-migrate.sh staging <sha> and it succeeded (skips the pending-migration stop)
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  checks: read
  deployments: read

concurrency:
  group: staging-release
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      sha: ${{ inputs.sha }}
      migrations_applied: ${{ inputs.migrations_applied }}
      services: api admin agent supplier website
