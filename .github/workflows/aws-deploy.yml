name: AWS deploy

# Manual, environment-gated (required reviewers on the GitHub environment). Rolls the named services to an image that already exists in ECR
# for the given commit. It does NOT run migrations: those are an owner-run one-off task (docs/runbooks/aws-ecs-deployment.md, step 7).
# ECS's deployment circuit breaker rolls a deployment back by itself if its tasks never become healthy.
# Also callable (staging-release.yml). The promotion gate and the environment approval apply identically to both entry points.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      sha:
        required: true
        type: string
      services:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [staging, production]
      sha:
        description: Full commit SHA whose images to deploy
        required: true
      services:
        description: Space-separated subset of api admin agent supplier website (deploy api first)
        required: true
        default: "api admin agent supplier website"

permissions:
  id-token: write
  contents: read
  checks: read
  deployments: read

concurrency:
  group: aws-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # Promotion gate. Runs before the environment approval and before any AWS credential is assumed: a commit that did not pass the
  # release checks, or (production) is not on main or was never deployed to staging, cannot be rolled out from here.
  gate:
    name: Promotion gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require green release checks, and for production main plus a successful staging deployment of the same commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          TARGET: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-character commit SHA" >&2; exit 1; }
          runs=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq '.check_runs[] | [.name, .status, (.conclusion // "none")] | @tsv')
          # Keep these names in step with the jobs in ci.yml.
          for required in "Schema integrity" "Prisma migration certification" "verify" "End-to-end release suite (Admin, Agent, Supplier)" "Website production checks"; do
            line=$(printf '%s\n' "$runs" | awk -F'\t' -v n="$required" '$1==n {l=$0} END {print l}')
            [ -n "$line" ] || { echo "required check '$required' has not run on $SHA" >&2; exit 1; }
            [ "$(printf '%s' "$line" | cut -f2,3)" = "$(printf 'completed\tsuccess')" ] || { echo "required check '$required' is not green on $SHA: $line" >&2; exit 1; }
          done
          if [ "$TARGET" = "production" ]; then
            rel=$(gh api "repos/$REPO/compare/main...$SHA" --jq .status)
            case "$rel" in identical|behind) ;; *) echo "$SHA is not on main (compare: $rel); production only deploys commits merged to main" >&2; exit 1 ;; esac
            ok=0
            for id in $(gh api "repos/$REPO/deployments?environment=staging&sha=$SHA&per_page=100" --jq '.[].id'); do
              state=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // "none"')
              [ "$state" = "success" ] && ok=1
            done
            [ "$ok" = 1 ] || { echo "$SHA has no successful staging deployment; deploy and verify staging first" >&2; exit 1; }
          fi
          echo "Gate passed for $SHA -> $TARGET" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Roll services one at a time and wait for stability
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          CLUSTER: fbeds-${{ inputs.environment }}
          SHA: ${{ inputs.sha }}
          SERVICES: ${{ inputs.services }}
        run: |
          set -euo pipefail
          REGISTRY_HOST="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-character commit SHA" >&2; exit 1; }
          for svc in $SERVICES; do
            case "$svc" in api|admin|agent|supplier|website) ;; *) echo "unknown service $svc" >&2; exit 1 ;; esac
            # Resolve the commit tag to its immutable digest and deploy THAT: the task definition pins repo@sha256:..., never a tag.
            digest=$(aws ecr describe-images --repository-name "fbeds/$svc" --image-ids imageTag="$SHA" --query 'imageDetails[0].imageDigest' --output text) \
              || { echo "no image fbeds/$svc:$SHA in ECR (never built?)" >&2; exit 1; }
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected digest '$digest' for $svc" >&2; exit 1; }
            image="$REGISTRY_HOST/fbeds/$svc@$digest"
            family="$CLUSTER-$svc"
            aws ecs describe-task-definition --task-definition "$family" --query taskDefinition > td.json
            jq --arg img "$image" --arg name "$svc" \
              'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy) | (.containerDefinitions[] | select(.name==$name) | .image) = $img' td.json > td-new.json
            arn=$(aws ecs register-task-definition --cli-input-json file://td-new.json --query taskDefinition.taskDefinitionArn --output text)
            aws ecs update-service --cluster "$CLUSTER" --service "$svc" --task-definition "$arn" >/dev/null
            aws ecs wait services-stable --cluster "$CLUSTER" --services "$svc"
            # A circuit-breaker rollback leaves the service "stable" on the OLD revision: verify we are really serving the new one.
            now=$(aws ecs describe-services --cluster "$CLUSTER" --services "$svc" --query 'services[0].taskDefinition' --output text)
            [ "$now" = "$arn" ] || { echo "$svc did not stay on $arn (rolled back to $now)" >&2; exit 1; }
            # Fully rolled: exactly one deployment left and every desired task running.
            read -r running desired deployments < <(aws ecs describe-services --cluster "$CLUSTER" --services "$svc" --query 'services[0].[runningCount,desiredCount,length(deployments)]' --output text)
            { [ "$running" = "$desired" ] && [ "$deployments" = 1 ]; } || { echo "$svc not fully rolled: running=$running desired=$desired deployments=$deployments" >&2; exit 1; }
            echo "$svc -> $image (commit $SHA)" >> "$GITHUB_STEP_SUMMARY"
            # The scheduled compliance tasks (ADR 0067) run the API image: register a matching revision. The schedules always use the latest
            # revision, so nothing else changes. Absent when compliance export is not enabled in this environment.
            if [ "$svc" = api ]; then
              for job in export verify; do
                cfamily="$CLUSTER-compliance-$job"
                aws ecs describe-task-definition --task-definition "$cfamily" --query taskDefinition > ctd.json 2>/dev/null || { echo "no $cfamily (compliance export not enabled)"; continue; }
                jq --arg img "$image" 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy) | (.containerDefinitions[] | select(.name=="compliance") | .image) = $img' ctd.json > ctd-new.json
                carn=$(aws ecs register-task-definition --cli-input-json file://ctd-new.json --query taskDefinition.taskDefinitionArn --output text)
                echo "$cfamily -> $carn" >> "$GITHUB_STEP_SUMMARY"
              done
            fi
          done
