name: AWS images

# Builds one image per app and pushes it to ECR tagged with the commit SHA. It never deploys. Manual only, until the AWS foundation exists
# (docs/runbooks/aws-ecs-deployment.md). ADR 0055: agent, admin, supplier and api images are environment-neutral (the portals resolve the API origin at
# request time), so the same digest is promoted between environments. Only the website bakes public, non-secret URLs (canonical/SEO) at build time and
# is therefore built per environment.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (selects the AWS role and the build settings)
        required: true
        type: choice
        options: [staging, production]
      apps:
        description: Space-separated subset of api admin agent supplier website
        required: true
        default: "api admin agent supplier website"

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          APPS: ${{ inputs.apps }}
        run: |
          set -euo pipefail
          json='['
          for a in $APPS; do
            case "$a" in
              api)      pkg='@bedbanks/api' ;;
              admin)    pkg='@bedbanks/admin-console' ;;
              agent)    pkg='@bedbanks/agent-portal' ;;
              supplier) pkg='@bedbanks/supplier-portal' ;;
              website)  pkg='@bedbanks/website' ;;
              *) echo "unknown app $a" >&2; exit 1 ;;
            esac
            json="$json{\"app\":\"$a\",\"package\":\"$pkg\"},"
          done
          echo "matrix={\"include\":${json%,}]}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The build role may only be assumed from main (see infra/aws/terraform/iam.tf).
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          APP: ${{ matrix.app }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          image="$REGISTRY/fbeds/$APP:${GITHUB_SHA}"
          if aws ecr describe-images --repository-name "fbeds/$APP" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "$image already exists (tags are immutable); nothing to do"; exit 0
          fi
          if [ "$APP" = api ]; then
            # Two targets of one recipe (ADR 0075): the runtime image (compiled JS, no prisma CLI) and the one-off migration task image.
            if ! aws ecr describe-images --repository-name "fbeds/$APP" --image-ids imageTag="$GITHUB_SHA-migrate" >/dev/null 2>&1; then
              docker buildx build --file apps/api/Dockerfile --target migrator --tag "$image-migrate" --push .
            fi
            docker buildx build --file apps/api/Dockerfile --target runner --tag "$image" --push .
            echo "pushed $image-migrate" >> "$GITHUB_STEP_SUMMARY"
          else
            docker buildx build --file Dockerfile.web --tag "$image" --push \
              --build-arg APP="$APP" --build-arg PACKAGE="$PACKAGE" \
              --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL }}" \
              --build-arg NEXT_PUBLIC_AGENT_URL="${{ vars.NEXT_PUBLIC_AGENT_URL }}" \
              --build-arg NEXT_PUBLIC_ADMIN_URL="${{ vars.NEXT_PUBLIC_ADMIN_URL }}" \
              --build-arg NEXT_PUBLIC_SUPPLIER_URL="${{ vars.NEXT_PUBLIC_SUPPLIER_URL }}" \
              --build-arg NEXT_PUBLIC_CONTACT_EMAIL="${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}" .
          fi
          echo "pushed $image" >> "$GITHUB_STEP_SUMMARY"
