# Render Blueprint for the FBEDS API. See docs/runbooks/api-deploy.md.
# Migrations and the fbeds_api_login runtime role are manual owner steps and are
# NOT run by this blueprint. BOOKING_ENABLED and the hold-expiry sweeper stay unset.
services:
  - type: web
    name: fbeds-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: starter
    region: frankfurt
    healthCheckPath: /api/v1/health/ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: API_PREFIX
        value: api/v1
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fbeds-redis
          property: connectionString
      # Runtime URL for fbeds_api_login (never the owner URL). Set in the dashboard. The API verifies at startup that this
      # login is not a superuser, has no BYPASSRLS and owns nothing, and refuses to boot otherwise (ADR 0040).
      # MIGRATION_DATABASE_URL / PROVISION_DATABASE_URL (owner credentials) are deliberately NOT defined here: they belong to
      # the release job and operators only, and tools/runtime-db-role-check.ts fails CI if they appear in this file.
      - key: DATABASE_URL
        sync: false
      # Dedicated booking-module login (fbeds_booking_ops_login), also identity-checked at first use. Never the same value as DATABASE_URL.
      - key: BOOKING_OPS_DATABASE_URL
        sync: false
      # Exact public origin of the Admin site, no path, no trailing slash.
      - key: ADMIN_ORIGIN
        sync: false
      # Comma-separated exact origins of the other portals (Agent, Supplier), HTTPS, no
      # paths. Leave empty until those portals are deployed (ADR 0010).
      - key: TRUSTED_ORIGINS
        sync: false

  - type: keyvalue
    name: fbeds-redis
    plan: starter
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
