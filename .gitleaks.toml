title = "fBeds gitleaks config"

[extend]
useDefault = true

# Reviewed 2026-10-18: default-rule hits on main are idempotencyKey literals and test-only SECRET constants in these files.
# Single historical hits on unmerged branches are exempted by exact fingerprint in .gitleaksignore instead.
# Path-scoped on purpose: production code and configuration are never exempt.
[allowlist]
description = "Test and verification fixtures (idempotency keys, test signing constants)"
paths = [
  '''packages/connectors/core/test/xml-connector\.test\.mjs''',
  '''apps/api/src/agent/agent-search\.contract\.spec\.ts''',
  '''apps/api/src/booking-ops/booking-bulk\.spec\.ts''',
  '''apps/website/tests/leads\.test\.ts''',
  '''apps/website/tests/lead-security\.test\.ts''',
  '''tools/admin-ops-verify/verify-inventory\.cjs''',
]
